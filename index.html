<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start Early Retirement Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lesson rail on the left with a wide stage on the right; the sandbox swaps the rail for an input panel. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --ink: #12192b;
  --ink-2: #4a5468;
  --ink-3: #6f788b;
  --line: #dde2ec;
  --accent: #1f3a68;
  --accent-soft: #e6ecf6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #1d7a46; --good-bg: #e3f3ea;
  --warn: #a4400f; --warn-bg: #fdeadf;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #1a1f2a; --ink: #eef1f6; --ink-2: #b9c1d0; --ink-3: #8c96a8;
    --line: #2d3443; --accent: #8fb3ec; --accent-soft: #24304a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #6fd29b; --good-bg: #183526; --warn: #f3a37c; --warn-bg: #3b2418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #1a1f2a; --ink: #eef1f6; --ink-2: #b9c1d0; --ink-3: #8c96a8;
  --line: #2d3443; --accent: #8fb3ec; --accent-soft: #24304a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #6fd29b; --good-bg: #183526; --warn: #f3a37c; --warn-bg: #3b2418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
html.big body { font-size: 19px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
header.top h1 small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .8rem; color: var(--ink-3); letter-spacing: 0; }
.modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-left: auto; }
.modes button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.ghost:hover { border-color: var(--accent); color: var(--accent); }

main { max-width: 1320px; margin: 0 auto; padding: 20px 24px 48px; }
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
.sandbox .layout { grid-template-columns: 340px minmax(0, 1fr); }
@media (max-width: 900px) { .layout, .sandbox .layout { grid-template-columns: 1fr; } }

/* lesson rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 84px; }
.rail button { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 9px 10px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.rail button .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); font-size: .85rem; }
.rail button:hover { background: var(--surface); }
.rail button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.rail button[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: var(--surface); }
@media (max-width: 900px) { .rail { position: static; flex-direction: row; overflow-x: auto; } .rail button { grid-template-columns: 28px auto; white-space: nowrap; } }

.stage { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; }
.eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.lesson-head h2 { font-size: 1.9rem; font-weight: 800; margin: 4px 0 10px; }
.lesson-head p { max-width: 68ch; margin: 0 0 8px; color: var(--ink-2); }
.lesson-head p strong { color: var(--ink); }

.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 22px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .92rem; }
.ctl .row { display: flex; align-items: center; gap: 10px; }
.ctl input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.ctl input[type=number] { width: 92px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: right; }
.ctl .hint { font-size: .8rem; color: var(--ink-3); margin-top: 2px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.kpi .k { font-size: .82rem; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .v.sm { font-size: 1.25rem; }
.kpi .sub { font-size: .82rem; color: var(--ink-2); }
.kpi.hero { border-color: var(--accent); background: var(--accent-soft); }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 4px; }

.chart-card h3 { font-size: 1.05rem; margin-bottom: 2px; }
.chart-card .cap { color: var(--ink-3); font-size: .88rem; margin: 0 0 10px; }
.chart-box { position: relative; height: 320px; }
html.big .chart-box { height: 380px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--ink-2); margin-bottom: 8px; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.discuss { border-left: 4px solid var(--s2); }
.discuss h3, .quiz h3 { font-size: 1rem; margin-bottom: 6px; }
.discuss ul { margin: 0; padding-left: 20px; color: var(--ink-2); }
.discuss li + li { margin-top: 4px; }
.quiz .q { font-weight: 600; margin: 0 0 10px; }
.quiz .opts { display: grid; gap: 8px; }
.quiz .opts button { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.quiz .opts button:hover:not(:disabled) { border-color: var(--accent); }
.quiz .opts button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 700; }
.quiz .opts button.wrong { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.quiz .opts button:disabled { cursor: default; }
.quiz .fb { margin-top: 10px; font-size: .95rem; }
.quiz + .quiz { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }

.navrow { display: flex; justify-content: space-between; gap: 12px; }
.primary { border: 0; background: var(--accent); color: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.primary:disabled { opacity: .4; cursor: default; }

/* sandbox */
.panel { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; }
@media (max-width: 900px) { .panel { position: static; max-height: none; } }
.scen-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scen-tabs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
.scen-tabs button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.panel fieldset { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 14px 14px; margin: 0; display: grid; gap: 12px; }
.panel legend { font-family: var(--font-display); font-weight: 700; padding: 0 6px; }
.panel .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 600; color: var(--ink-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.table-wrap { overflow: auto; max-height: 520px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 700; color: var(--ink-2); }
th:first-child, td:first-child { text-align: left; }
tr.phase td { background: var(--accent-soft); font-weight: 700; text-align: left; }
td.neg { color: var(--warn); font-weight: 700; }
.note { font-size: .85rem; color: var(--ink-3); max-width: 80ch; }
.scen-b-off { opacity: .55; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header class="top">
  <h1>Start Early Retirement Lab<small>Why saving early matters, from first paycheck to final years</small></h1>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-lesson" aria-pressed="true">Guided lesson</button>
    <button id="mode-sandbox" aria-pressed="false">Sandbox</button>
  </div>
  <button class="ghost" id="bigtext" aria-pressed="false" title="Larger text for projecting">Projector text</button>
</header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Retirement model ported from NFI_EB_Presentation.xlsx
const Engine = (() => {
  // ---------- Accumulation (Step 1) ----------
  // p: {salary, raise, startAge, retireAge, saveStart, saveEnd, myPct, matchPct,
  //     rAggr, rNorm, rCons, consYears, current, tax, lossAge?, lossPct?}
  function accumulate(p) {
    const rows = [];
    let bal = p.current || 0;
    let salary = p.salary;
    const consFrom = p.retireAge - p.consYears;      // H5
    const aggrUntil = p.startAge + p.consYears * 2;  // H6
    for (let age = p.startAge; age < p.retireAge; age++) {
      if (age > p.startAge) salary *= 1 + p.raise;
      const saving = age >= p.saveStart && age < p.saveEnd;
      const mine = saving ? salary * p.myPct : 0;
      const match = saving ? salary * Math.min(p.myPct, p.matchPct) : 0; // match only on what you put in, up to the cap
      let rate = age >= consFrom ? p.rCons : age < aggrUntil ? p.rAggr : p.rNorm;
      if (p.lossAge === age) rate = -p.lossPct; // market-loss scenario: that year's return is replaced by a loss
      const growth = bal * rate;
      bal = bal + mine + match + growth;
      const taxable = salary - mine;
      rows.push({ age, salary, mine, match, growth, rate, bal, taxable, takeHome: taxable * (1 - p.tax) });
    }
    const sum = k => rows.reduce((s, r) => s + r[k], 0);
    return {
      rows,
      final: rows.length ? rows[rows.length - 1].bal : bal,
      lastSalary: rows.length ? rows[rows.length - 1].salary : p.salary,
      totalMine: sum('mine'),
      totalMatch: sum('match'),
      totalGrowth: sum('growth'),
    };
  }

  // ---------- Distribution (Step 3) ----------
  // d: {needPct, inflation, rRet, ssOn, ssMonthly, cola, otherMonthly, otherGrowth, lifeExp}
  function distribute(acc, p, d) {
    const rows = [];
    let need = d.needPct * acc.lastSalary;
    let ss = d.ssOn ? d.ssMonthly * 12 : 0;
    let other = d.otherMonthly * 12;
    let bal = acc.final;
    let depletedAge = null;
    const endAge = Math.max(d.lifeExp, p.retireAge + 1);
    for (let age = p.retireAge; age < endAge; age++) {
      if (age > p.retireAge) { need *= 1 + d.inflation; ss *= 1 + d.cola; other *= 1 + d.otherGrowth; }
      const withdraw = Math.max(0, need - ss - other);
      const growth = Math.max(0, bal) * d.rRet;
      bal = bal + growth - withdraw;
      if (bal < 0 && depletedAge === null) depletedAge = age;
      rows.push({ age, need, ss, other, withdraw, growth, bal });
    }
    return { rows, depletedAge, endBal: rows.length ? rows[rows.length - 1].bal : bal };
  }

  // ---------- Comparisons ----------
  function savingTiming(p) {
    const end = p.retireAge;
    const all = accumulate({ ...p, saveStart: p.startAge, saveEnd: end });
    const skipFirst = accumulate({ ...p, saveStart: p.startAge + 5, saveEnd: end });
    const skipLast = accumulate({ ...p, saveStart: p.startAge, saveEnd: end - 5 });
    return { all, skipFirst, skipLast };
  }
  function lossTiming(p, lossPct) {
    const base = { ...p, saveStart: p.startAge, saveEnd: p.retireAge };
    const bench = accumulate(base).final;
    const byAge = [];
    for (let a = p.startAge + 1; a < p.retireAge; a++) {
      byAge.push({ age: a, final: accumulate({ ...base, lossAge: a, lossPct }).final });
    }
    return { bench, byAge };
  }
  // Simplified Traditional vs Roth (mirrors Comparisons!B17:E33)
  function rothVsTrad(c) {
    const fv = x => x * Math.pow(1 + c.r, c.years);
    const taxSaved = c.amount * c.taxNow;
    return {
      taxSaved,
      tradGross: fv(c.amount),
      tradNet: fv(c.amount) * (1 - c.taxRet),
      tradPlusGross: fv(c.amount + taxSaved),
      tradPlusNet: fv(c.amount + taxSaved) * (1 - c.taxRet),
      roth: fv(c.amount),
    };
  }
  return { accumulate, distribute, savingTiming, lossTiming, rothVsTrad };
})();


</script>
<script>
(() => {
// ---------------- defaults (from NFI_EB_Presentation.xlsx) ----------------
const DEFAULTS = {
  salary: 45000, raise: 0.02, startAge: 25, retireAge: 64, saveStart: 28, saveEnd: 67,
  myPct: 0.08, matchPct: 0.05, current: 0, tax: 0.18,
  rAggr: 0.12, rNorm: 0.10, rCons: 0.08, consYears: 5,
  needPct: 0.75, inflation: 0.07, rRet: 0.03, lifeExp: 92,
  ssOn: true, ssMonthly: 4900, cola: 0.024, otherMonthly: 0, otherGrowth: 0.02,
};
const ROTH = { amount: 3000, taxNow: 0.174, taxRet: 0.15, r: 0.07, years: 43 };
// Workbook's SSA Quick Calculator estimates ($55,000 starting salary at 23), monthly
const SS_TABLE = { 62: 3800, 63: 4350, 64: 4900, 65: 5600, 66: 6300, 67: 7000, 68: 7700, 69: 8350, 70: 9000 };

const FIELDS = {
  salary: { label: 'Starting salary', min: 20000, max: 150000, step: 1000, kind: 'money' },
  raise: { label: 'Yearly raise', min: 0, max: 0.06, step: 0.005, kind: 'pct' },
  startAge: { label: 'Age you start working', min: 18, max: 45, step: 1, kind: 'age' },
  retireAge: { label: 'Retirement age', min: 50, max: 75, step: 1, kind: 'age' },
  saveStart: { label: 'Saving starts at age', min: 18, max: 70, step: 1, kind: 'age' },
  saveEnd: { label: 'Saving stops at age', min: 20, max: 80, step: 1, kind: 'age', hint: 'Saving also stops at retirement.' },
  myPct: { label: 'Your contribution', min: 0, max: 0.2, step: 0.01, kind: 'pct', hint: '% of salary into your 401(k)' },
  matchPct: { label: 'Employer match limit', min: 0, max: 0.1, step: 0.005, kind: 'pct', hint: 'Matched dollar-for-dollar up to this % of salary' },
  current: { label: 'Savings you already have', min: 0, max: 200000, step: 1000, kind: 'money' },
  tax: { label: 'Income tax rate', min: 0, max: 0.4, step: 0.01, kind: 'pct' },
  rAggr: { label: 'Aggressive return (early career)', min: 0, max: 0.15, step: 0.005, kind: 'pct' },
  rNorm: { label: 'Normal return (mid career)', min: 0, max: 0.15, step: 0.005, kind: 'pct' },
  rCons: { label: 'Conservative return (near retirement)', min: 0, max: 0.15, step: 0.005, kind: 'pct' },
  consYears: { label: 'Conservative years before retiring', min: 0, max: 15, step: 1, kind: 'years', hint: 'Aggressive period lasts twice as long, from your starting age' },
  needPct: { label: 'Income needed in retirement', min: 0.4, max: 1, step: 0.05, kind: 'pct', hint: '% of your final salary' },
  inflation: { label: 'Inflation in retirement', min: 0, max: 0.1, step: 0.005, kind: 'pct', hint: 'Workbook uses 7% to cover rising health-care costs' },
  rRet: { label: 'Return during retirement', min: 0, max: 0.1, step: 0.005, kind: 'pct' },
  lifeExp: { label: 'Plan to live until', min: 70, max: 105, step: 1, kind: 'age' },
  ssOn: { label: 'Include Social Security', kind: 'bool' },
  ssMonthly: { label: 'Social Security per month', min: 0, max: 10000, step: 50, kind: 'money', hint: 'Starts at retirement age' },
  cola: { label: 'Social Security yearly increase (COLA)', min: 0, max: 0.05, step: 0.001, kind: 'pct' },
  otherMonthly: { label: 'Other income per month', min: 0, max: 5000, step: 50, kind: 'money', hint: 'Pension, rental income, other savings' },
  otherGrowth: { label: 'Other income yearly increase', min: 0, max: 0.06, step: 0.005, kind: 'pct' },
  // lesson-only
  earlyStart: { label: 'Early saver starts at', min: 18, max: 50, step: 1, kind: 'age' },
  lateStart: { label: 'Late saver starts at', min: 18, max: 55, step: 1, kind: 'age' },
  lossPct: { label: 'Size of the market drop', min: 0.05, max: 0.4, step: 0.05, kind: 'pct' },
  amount: { label: 'Yearly IRA contribution', min: 500, max: 7500, step: 100, kind: 'money' },
  taxNow: { label: 'Your tax rate today', min: 0, max: 0.45, step: 0.005, kind: 'pct' },
  taxRet: { label: 'Your tax rate in retirement', min: 0, max: 0.45, step: 0.005, kind: 'pct' },
  r: { label: 'Yearly return', min: 0, max: 0.12, step: 0.005, kind: 'pct' },
  years: { label: 'Years until retirement', min: 5, max: 50, step: 1, kind: 'years' },
};

// ---------------- formatting ----------------
const money = x => (x < 0 ? '−$' : '$') + Math.round(Math.abs(x)).toLocaleString('en-US');
const moneyShort = x => {
  const a = Math.abs(x), s = x < 0 ? '−$' : '$';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return s + Math.round(a / 1e3) + 'K';
  return s + Math.round(a);
};
const pct = x => { const v = x * 100; return (Math.abs(v - Math.round(v)) < 1e-9 ? Math.round(v) : v.toFixed(1)) + '%'; };
const fmt = (kind, v) => kind === 'money' ? money(v) : kind === 'pct' ? pct(v) : kind === 'age' ? 'age ' + v : v + ' yrs';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

// ---------------- controls ----------------
let uid = 0;
function control(key, st) {
  const f = FIELDS[key]; const id = 'c' + (++uid) + '-' + key;
  if (f.kind === 'bool') {
    return `<div class="ctl"><label class="toggle" for="${id}"><input type="checkbox" id="${id}" data-key="${key}" ${st[key] ? 'checked' : ''}> ${f.label}</label>${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
  }
  const scale = f.kind === 'pct' ? 100 : 1;
  const nv = +(st[key] * scale).toFixed(3);
  return `<div class="ctl">
    <label for="${id}"><span>${f.label}</span></label>
    <div class="row">
      <input type="range" id="${id}" data-key="${key}" min="${f.min}" max="${f.max}" step="${f.step}" value="${st[key]}" aria-label="${esc(f.label)}">
      <input type="number" id="${id}-n" data-key="${key}" data-num="1" min="${f.min * scale}" max="${f.max * scale}" step="${+(f.step * scale).toFixed(3)}" value="${nv}" aria-label="${esc(f.label)} ${f.kind === 'pct' ? '(percent)' : ''}">
    </div>
    ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
  </div>`;
}
function bindControls(root, getState, onChange) {
  root.addEventListener('input', e => {
    const el = e.target, key = el.dataset && el.dataset.key;
    if (!key || !FIELDS[key]) return;
    const st = getState(), f = FIELDS[key];
    if (f.kind === 'bool') st[key] = el.checked;
    else {
      const scale = f.kind === 'pct' ? 100 : 1;
      let v = parseFloat(el.value);
      if (!isFinite(v)) return;
      if (el.dataset.num) v = v / scale;
      st[key] = v;
      const row = el.closest('.row');
      const other = row.querySelector(el.dataset.num ? 'input[type=range]' : 'input[type=number]');
      if (el.dataset.num) other.value = v; else other.value = +(v * scale).toFixed(3);
    }
    onChange(key);
  });
}

// ---------------- charts ----------------
const charts = {};
function theme() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  return { s1: g('--s1'), s2: g('--s2'), s3: g('--s3'), ink: g('--ink'), ink2: g('--ink-2'), ink3: g('--ink-3'), line: g('--line'), surface: g('--surface'), accent: g('--accent') };
}
function draw(id, config) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, config);
}
function baseOpts({ xTitle, yFmt = moneyShort, stacked = false, xLinear = false, horizontal = false, tooltipFmt = money } = {}) {
  const t = theme();
  const valueAxis = { stacked, grid: { color: t.line }, border: { display: false }, ticks: { color: t.ink3, callback: v => yFmt(v) }, beginAtZero: true };
  const catAxis = { stacked, type: xLinear ? 'linear' : 'category', grid: { display: false }, border: { color: t.line }, ticks: { color: t.ink3, precision: 0, maxRotation: 0, autoSkipPadding: 10 }, title: xTitle ? { display: true, text: xTitle, color: t.ink3 } : undefined };
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    indexAxis: horizontal ? 'y' : 'x',
    interaction: { mode: xLinear ? 'nearest' : 'index', axis: horizontal ? 'y' : 'x', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: t.surface, titleColor: t.ink, bodyColor: t.ink2, borderColor: t.line, borderWidth: 1, padding: 10, boxPadding: 4,
        callbacks: { label: c => ` ${c.dataset.label}: ${tooltipFmt(horizontal ? c.parsed.x : c.parsed.y)}` } },
    },
    scales: horizontal ? { y: { ...catAxis, type: 'category' }, x: valueAxis } : { x: catAxis, y: valueAxis },
  };
}
const legend = items => `<div class="legend">${items.map(([c, l]) => `<span><span class="swatch" style="background:var(${c})"></span>${l}</span>`).join('')}</div>`;
const lineDs = (label, data, color, extra = {}) => ({ label, data, borderColor: color, backgroundColor: color, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0.15, ...extra });
const barDs = (label, data, color, extra = {}) => ({ label, data, backgroundColor: color, borderRadius: 4, borderSkipped: 'start', borderColor: theme().surface, borderWidth: { top: 0, right: 0, left: 0, bottom: 0 }, ...extra });

// ---------------- model helpers ----------------
function run(p) {
  const acc = Engine.accumulate(p);
  const dist = Engine.distribute(acc, p, p);
  const life = [{ x: p.startAge, y: p.current || 0 }]
    .concat(acc.rows.map(r => ({ x: r.age + 1, y: r.bal })))
    .concat(dist.rows.map(r => ({ x: r.age + 1, y: Math.max(0, r.bal) })));
  return { acc, dist, life };
}
function lastsChip(p, dist) {
  if (p.retireAge >= p.lifeExp) return `<span class="chip good">Retires after age ${p.lifeExp}</span>`;
  return dist.depletedAge !== null
    ? `<span class="chip warn">▲ Runs out at age ${dist.depletedAge}</span>`
    : `<span class="chip good">✓ Lasts to age ${p.lifeExp}</span>`;
}
function solveCatchUp(p, target) { // contribution % needed to reach target
  const f = x => Engine.accumulate({ ...p, myPct: x }).final;
  if (f(1) < target) return null;
  let lo = 0, hi = 1;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (f(m) < target) lo = m; else hi = m; }
  return hi;
}

// ---------------- quiz ----------------
function quizHTML(qs) {
  return qs.map((q, qi) => `<div class="quiz" data-q="${qi}">
    <p class="q">${q.q}</p>
    <div class="opts">${q.opts.map((o, i) => `<button type="button" data-i="${i}">${o}</button>`).join('')}</div>
    <div class="fb" aria-live="polite"></div></div>`).join('');
}
function bindQuiz(root, qs) {
  root.querySelectorAll('.quiz').forEach(box => {
    const q = qs[+box.dataset.q];
    box.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      box.querySelectorAll('.opts button').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('right'); });
      if (i !== q.a) b.classList.add('wrong');
      box.querySelector('.fb').innerHTML = `<strong>${i === q.a ? 'Correct.' : 'Not quite.'}</strong> ${q.why} <button type="button" class="ghost" style="margin-left:6px;padding:2px 8px">Try again</button>`;
      box.querySelector('.fb button').addEventListener('click', () => {
        box.querySelectorAll('.opts button').forEach(x => { x.disabled = false; x.classList.remove('right', 'wrong'); });
        box.querySelector('.fb').innerHTML = '';
      });
    }));
  });
}

function renderLesson() {

      </div>

      </div>
    </section></div>`;
  app.querySelectorAll('.rail button').forEach(b => b.onclick = () => { S.step = +b.dataset.step; render(); window.scrollTo(0, 0); });
  const prev = document.getElementById('prev'); if (prev) prev.onclick = () => { S.step--; render(); window.scrollTo(0, 0); };
  const next = document.getElementById('next'); if (next) next.onclick = () => { S.step++; render(); window.scrollTo(0, 0); };
  const n2 = document.getElementById('next2'); if (n2) n2.onclick = () => setMode('sandbox');
  const gs = document.getElementById('go-sandbox'); if (gs) gs.onclick = () => setMode('sandbox');
  const rs = document.getElementById('reset-step'); if (rs) rs.onclick = () => { S.stepState[i] = step.init(); render(); };

  if (ctls) bindControls(ctls, () => S.stepState[S.step], () => { document.getElementById('out').innerHTML = step.body(S.stepState[S.step]); step.draw(S.stepState[S.step]); });
  bindQuiz(document.getElementById('quizbox'), qs);
  step.draw(st);
}

  const drawRoth = () => {
    const x = Engine.rothVsTrad(sb.roth);
    document.getElementById('rothout').innerHTML = `<table><thead><tr><th>Account</th><th>Before tax</th><th>After tax</th></tr></thead><tbody>
      <tr><td>Traditional (spend the ${money(x.taxSaved)} tax savings)</td><td>${money(x.tradGross)}</td><td>${money(x.tradNet)}</td></tr>
      <tr><td>Traditional (invest the tax savings)</td><td>${money(x.tradPlusGross)}</td><td>${money(x.tradPlusNet)}</td></tr>
      <tr><td>Roth</td><td>${money(x.roth)}</td><td><strong>${money(x.roth)}</strong></td></tr></tbody></table>`;
  };
  bindControls(document.getElementById('lossctl'), () => sb, drawLoss);
  bindControls(document.getElementById('rothctl'), () => sb.roth, drawRoth);
  drawLoss(); drawRoth();
}

// redraw on theme change
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } catch (e) {}
try { new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}

if (window.Chart) { Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; }
render();
})();

</script>
</body>
